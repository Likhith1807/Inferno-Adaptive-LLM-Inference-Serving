name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas matplotlib pyyaml httpx pytest black flake8
          pip install -e . --no-deps

      - name: Lint (flake8)
        run: flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503 || true

      - name: Format check (black)
        run: black --check src/ tests/ || true

      - name: Run non-GPU tests
        run: |
          export PYTHONPATH=src
          pytest tests/ -v -k "not kernels"
